<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Campo Minado com Dengue</title>
        <link rel="stylesheet" href="styles.css">
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A6%9F</text></svg>">
        <script
            src="https://code.jquery.com/jquery-3.6.1.slim.min.js"
            integrity="sha256-w8CvhFs7iHNVUtnSP0YKEg00p9Ih13rlL9zGqvLdePA="
            crossorigin="anonymous"></script>
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <div id="container">
            <div class="menu">
                <h1 class="title">Campo Minado</h1>
                <div class="difficulty">
                    <span class="subtitle">Escolha sua dificuldade</span>
                    <div class="options">
                        <span class="option" id="easy">Fácil</span>
                        <span class="option" id="normal">Média</span>
                        <span class="option" id="hard">Difícil</span>
                    </div>
                </div>
                <div class="algorithm" style="margin-top: 2rem;">
                    <span class="subtitle">Escolha o algoritmo de busca</span>
                    <div class="options">
                        <span class="option" id="BFS">BFS</span>
                        <span class="option" id="DFS">DFS</span>
                    </div>
                </div>
                <div class="info">
                    <div class="timer">
                        <span>Timer: </span>
                        <span id="timer">0 (s)</span>
                    </div>
                    <div class="mosquitos-left">
                        <span>Mosquitos: </span>
                        <span id="mosquitos-left"></span>
                    </div>
                </div>
                <span id="restart">Reiniciar</span>
            </div>
            <div id="board"></div>
        </div>
    </body>
</html>
